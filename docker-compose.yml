services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fitwoman_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: fitwoman_nginx
    ports:
      - "8000:80"         # localhost:8000 → nginx:80
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8
    container_name: fitwoman_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - mysql_data:/var/lib/mysql
    # se não precisar acessar o MySQL de fora, pode tirar essas portas:
    ports:
      - "3306:3306"

volumes:
  mysql_data:
